spring:
    application:
      name: payment-service

    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      producer:
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8082

ledger:
  topic: ledger.transactions

grpc:
  client:
    user-service:
      address: ${GRPC_USER_ADDRESS:static://localhost:9090}
      negotiationType: plaintext

    wallet-service:
      address: ${GRPC_WALLET_ADDRESS:static://localhost:9091}
      negotiationType: plaintext

    fraud-service:
      address: ${GRPC_FRAUD_ADDRESS:static://localhost:9093}
      negotiationType: plaintext

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-value-at-least-32-bytes}
