spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5435/auth_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8083

grpc:
  client:
    user-service:
      address: ${GRPC_USER_ADDRESS:static://localhost:9090}
      negotiationType: plaintext

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-value-at-least-32-bytes}
  expiration: 3600000
  refresh-expiration: 604800000
