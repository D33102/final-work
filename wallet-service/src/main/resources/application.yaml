spring:
  application:
    name: wallet-service

  datasource:
    url: jdbc:postgresql://localhost:5433/wallet_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

grpc:
  client:
    user-service:
      address: ${GRPC_USER_ADDRESS:static://localhost:9090}
      negotiationType: plaintext

  server:
    port: 9091

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-value-at-least-32-bytes}