spring:
  application:
      name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5434/user_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8081
  
grpc:
  server:
    port: 9090

jwt:
  secret: change-this-to-a-long-random-secret-value-at-least-32-bytes
