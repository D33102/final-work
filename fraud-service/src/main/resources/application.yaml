spring:
  application:
    name: fraud-service

  datasource:
    url: jdbc:postgresql://localhost:5437/fraud_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

grpc:
  server:
    port: 9093

fraud:
  max-amount: 1000000
  daily-limit: 5000000
  velocity:
    max-count: 10
    window-seconds: 60
  blocklist:
    - BLOCKED-ACCOUNT
