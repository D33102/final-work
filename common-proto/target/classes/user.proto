syntax = "proto3";

package user;

option java_multiple_files = true;
option java_package = "com.proj.grpc.user";
option java_outer_classname = "UserProto";

service UserService {

  rpc ExistsUser(ExistsUserRequest)
      returns (ExistsUserResponse);

  rpc GetUser(GetUserRequest)
      returns (UserResponse);
}

message ExistsUserRequest {
  string user_id = 1;
}

message ExistsUserResponse {
  bool exists = 1;
}

message GetUserRequest {
  string user_id = 1;
}

message UserResponse {
  string user_id = 1;
  string email = 2;
  string full_name = 3;
  string phone_number = 4;
}