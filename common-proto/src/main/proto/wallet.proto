syntax = "proto3";

package wallet;

option java_multiple_files = true;
option java_package = "com.proj.grpc.wallet";
option java_outer_classname = "WalletProto";

service WalletService {

  rpc Transfer(TransferRequest)
      returns (TransferResponse);

  rpc Credit(CreditRequest)
      returns (BalanceResponse);
}

message TransferRequest {
  string from_account = 1;
  string to_account = 2;
  int64 amount = 3;
  string currency = 4;
}

message TransferResponse {
  int64 sender_balance = 2;
  int64 receiver_balance = 3;
}

message CreditRequest {
  string account_no = 1;
  int64 amount = 2;
  string currency = 3;
}

message BalanceResponse {
  int64 balance = 1;
}